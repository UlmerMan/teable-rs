[package]
name = "teable"
version = "0.0.1"
edition = "2024"

[features]
default = ["async"]
async = ["reqwest/default"]
blocking = ["reqwest/blocking"]

[dependencies]
maybe-async = "0.2.11"
reqwest = {version = "0.13.4", default-features = false, features = ["json", "query"]}
reqwest-middleware = { version = "0.5.2", features = ["query", "json"] }
reqwest-retry = "0.9.1"
secrecy = "0.10.3"
serde = "1.0.229"
thiserror = "2.0.20"
url = "2.5.8"
